# Local development only: PostgreSQL and Redis for the tests and for running the service by hand.
#   docker compose -f compose.dev.yml up -d --wait
#   export TBO_TEST_DATABASE_URL=postgresql+asyncpg://tbo:tbo@127.0.0.1:55432/tbo_dev
#   export TBO_TEST_REDIS_URL=redis://127.0.0.1:56379/0
# The real stack (modes, ACL users, roles, secrets) is tbo_platform's deploy/compose.yml; nothing here is used there.
name: tbo-technical-engine-dev
services:
  postgres:
    image: timescale/timescaledb:2.31.0-pg16@sha256:322ae364eca3321cf2a48f1ef31213b87843413b3cf8feeebf54e999a26bb731
    environment:
      POSTGRES_DB: tbo_dev
      POSTGRES_USER: tbo
      POSTGRES_PASSWORD: tbo
      TIMESCALEDB_TELEMETRY: "off"
    ports: ["127.0.0.1:55432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tbo -d tbo_dev -h 127.0.0.1"]
      interval: 5s
      retries: 12
  redis:
    image: redis:8.10.2-alpine@sha256:0bf6577d7774e592b29d093e3ac9390eb91e13d72c21e506afce736de5e0eeb0
    ports: ["127.0.0.1:56379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 12
