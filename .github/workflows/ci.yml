# CI is tbo_platform's reusable workflow, pinned to the template's release: lint, types, tests against real
# PostgreSQL and Redis, Schemathesis, the contract check. The image build, Trivy scan and release are
# off by default (the runner has no Docker).
name: CI
# Runs on the self-hosted runner pool (label tbo-ci); the image build is off until a tbo-docker runner exists.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  ci:
    uses: shankarThiyagaraajan/tbo_platform/.github/workflows/python-service.yml@10adde74dd312c75e4d767841c73815756f4c6b0
    permissions:
      contents: write
      packages: write
    secrets:
      # A fine-grained token with read access to tbo_platform and tbo_contracts (private git dependencies).
      TBO_READ_TOKEN: ${{ secrets.TBO_READ_TOKEN }}
