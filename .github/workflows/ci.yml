# CI is tbo_platform's reusable workflow, pinned to the template's release: lint, types, tests against real
# PostgreSQL and Redis, Schemathesis, the contract check. The image build, Trivy scan and release are
# off by default (the runner has no Docker).
name: CI
# Manual start only (project rule 17): checks run locally with `make check` before a push; GitHub's runner minutes are kept
# for tags and releases. Start this by hand when a hosted run is wanted.
on:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  ci:
    uses: shankarThiyagaraajan/tbo_platform/.github/workflows/python-service.yml@299aaa9e1f472881d1abccc1b19ec21a954c3a75
    permissions:
      contents: write
      packages: write
    secrets:
      # A fine-grained token with read access to tbo_platform and tbo_contracts (private git dependencies).
      TBO_READ_TOKEN: ${{ secrets.TBO_READ_TOKEN }}
