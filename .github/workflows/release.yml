name: Release

# Makes the next version tag and a GitHub release with notes. Started by hand (or by the merging thread through
# workflow_dispatch) after a change that is worth a release; a typo or a tiny edit gets none. Project rule 17.
#   main  = first number: a breaking change            v1.4.2 -> v2.0.0
#   sub   = middle number: a notable change, a feature  v1.1.3 -> v1.2.0
#   macro = last number: a bug fix or review fix        v1.0.1 -> v1.0.2
# Each number runs 0 to 50; one that would pass 50 rolls up (v1.0.50 + macro -> v1.1.0). With no tag yet the base
# is v0.0.0. Checks are not run here: `make check` runs locally before the push (the runner minutes are for tags only).
# Tags are made only by this workflow, never by hand (LESSONS.md lesson 7).
on:
  workflow_dispatch:
    inputs:
      level:
        description: "main (breaking), sub (notable change) or macro (bug fix, review fix)"
        required: true
        type: choice
        options: [macro, sub, main]
      summary:
        description: "What changed, in a few lines"
        required: true
        type: string
      why:
        description: "Why: the problem or reason behind the change"
        required: true
        type: string
      action:
        description: "Action needed from users of this repo (migration, restart, new setting), or None"
        required: true
        default: "None"
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the tag and the GitHub release
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Next version, notes and release
        env:
          GH_TOKEN: ${{ github.token }}
          LEVEL: ${{ inputs.level }}
          SUMMARY: ${{ inputs.summary }}
          WHY: ${{ inputs.why }}
          ACTION: ${{ inputs.action }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::run the release from main, not ${GITHUB_REF}"; exit 1
          fi
          # Each number runs 0 to 50. A number that would pass 50 rolls up: v1.0.50 + macro -> v1.1.0, v1.50.3 + sub -> v2.0.0.
          next_version() {
            local level="$1" latest="${2:-v0.0.0}" a b c
            [[ "$latest" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || { echo "bad tag: $latest" >&2; return 1; }
            a=${BASH_REMATCH[1]}; b=${BASH_REMATCH[2]}; c=${BASH_REMATCH[3]}
            case "$level" in
              main) a=$((a + 1)); b=0; c=0 ;;
              sub) b=$((b + 1)); c=0 ;;
              macro) c=$((c + 1)) ;;
              *) echo "level must be main, sub or macro" >&2; return 1 ;;
            esac
            if [ "$c" -gt 50 ]; then c=0; b=$((b + 1)); fi
            if [ "$b" -gt 50 ]; then b=0; a=$((a + 1)); fi
            if [ "$a" -gt 50 ]; then echo "major number would pass 50" >&2; return 1; fi
            echo "v${a}.${b}.${c}"
          }
          latest="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"
          tag="$(next_version "${LEVEL}" "${latest}")"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "::error::tag ${tag} already exists"; exit 1
          fi
          range="${latest:+${latest}..}HEAD"
          {
            echo "## ${tag} (${LEVEL} release)"
            echo
            echo "### What changed"
            echo "${SUMMARY}"
            echo
            echo "### Why"
            echo "${WHY}"
            echo
            echo "### Action needed"
            echo "${ACTION}"
            echo
            echo "### Commits since ${latest:-the start}"
            git log --no-merges --format='- %s (%h, %an)' "${range}"
          } > "${RUNNER_TEMP}/notes.md"
          # --target: the tag does not exist yet; the release creates it on this commit.
          gh release create "${tag}" --target "${GITHUB_SHA}" --title "${tag}" --notes-file "${RUNNER_TEMP}/notes.md"
          echo "Released ${tag}"
